[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multilingual-humor-detection"
version = "0.1.0"
description = "Paper-aligned multilingual humor detection experiments"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [
  {name = "Ivana Crescenzi"},
  {name = "Jakub Jerzy Górecki"},
  {name = "Emanuele Moscato"},
  {name = "Debora Nozza"}
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "PyYAML>=6.0,<7",
  "scikit-learn>=1.8,<1.10",
]

[project.optional-dependencies]
test = ["pytest>=9,<10"]
transformers = [
  "torch>=2.2,<3",
  "transformers>=4.46,<5",
  "datasets>=3,<4",
  "accelerate>=1,<2",
]
openai = ["openai>=2.48,<3"]
qwen = [
  "torch>=2.2,<3",
  "transformers>=4.46,<5",
  "accelerate>=1,<2",
  "safetensors>=0.4,<1",
]

[project.scripts]
humor-prepare-data = "humor_detection.cli:prepare_data_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
