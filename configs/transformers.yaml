seed: 42
metric: f1_macro
training:
  batch_size: 16
  epochs: 5
  max_length: 128
  optimizer: AdamW
  warmup_ratio: 0.08
  paper_reported_warmup_range: [0.06, 0.10]
  mixed_precision_when_available: true
  hardware: one_gpu
models:
  xlm-r:
    model_id: FacebookAI/xlm-roberta-base
    learning_rate: 0.00002
  language_specific:
    en:
      paper_name: DeBERTa-v3-base
      model_id: microsoft/deberta-v3-base
      learning_rate: 0.00005
    es:
      paper_name: BETO
      model_id: dccuchile/bert-base-spanish-wwm-cased
      learning_rate: 0.00005
    pt:
      paper_name: BERTimbau
      model_id: neuralmind/bert-base-portuguese-cased
      learning_rate: 0.00005
    zh:
      paper_name: BERT-Chinese
      paper_model_id: bert-base-chinese
      model_id: google-bert/bert-base-chinese
      learning_rate: 0.00005
    hi_en:
      paper_name: MuRIL
      model_id: google/muril-base-cased
      learning_rate: 0.00005
